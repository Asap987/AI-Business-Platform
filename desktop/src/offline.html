<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>KASORA AI</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0}
  main{max-width:28rem;padding:2rem;text-align:center}
  h1{font-size:1.4rem;margin:0 0 .75rem} p{margin:.5rem 0;color:#94a3b8;line-height:1.5}
  button{margin-top:1.25rem;padding:.65rem 1.4rem;border:0;border-radius:.5rem;background:#38bdf8;color:#0f172a;font-weight:600;font-size:1rem;cursor:pointer}
</style></head>
<body><main>
  <h1 id="title">Can't reach KASORA AI</h1>
  <p>Check your internet connection and try again. Nothing you typed was lost on the server.</p>
  <p id="detail"></p>
  <button id="retry" type="button">Try again</button>
</main>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('detail').textContent = q.get('reason') || '';
  document.getElementById('retry').addEventListener('click', () => { location.href = 'kasora-retry://now'; });
</script></body></html>
